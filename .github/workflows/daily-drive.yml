
name: Ricky Daily Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
      timezone: 'Europe/Amsterdam'

permissions:
  contents: write

concurrency:
  group: ricky-daily-drive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Update Spotify playlist
        env:
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATER }}
        run: python ricks_daily_drive_cloud.py

      - name: Save podcast history
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for file in daily_drive_*histor*.json; do
            if [ -f "$file" ]; then
              git add -f -- "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m 'Update podcast history'
            git push
          else
            echo 'Geen wijzigingen in geschiedenis.'
          fi
